# Generates DeepARAMPad.xcodeproj: run `xcodegen` in this folder (brew install xcodegen).
name: DeepARAMPad
options:
  bundleIdPrefix: com.deeparam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DeepARAMPad:
    path: .
targets:
  DeepARAM:
    type: application
    platform: iOS
    sources: [App/DeepARAM]
    dependencies:
      - package: DeepARAMPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeparam.ipad
        PRODUCT_NAME: DeepARAM
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DeepARAM
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: App/DeepARAM/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: com.deeparam.ipad
            CFBundleURLSchemes: [deeparam]
schemes:
  DeepARAM:
    build:
      targets:
        DeepARAM: all
    run:
      config: Debug
