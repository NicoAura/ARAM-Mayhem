<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayhem Stats</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="head">
    <div class="titles">
      <p class="label">Your match history</p>
      <h1>My Stats</h1>
      <p id="account" class="sub" hidden></p>
      <p id="sample-note" class="sample-note" hidden>Showing example games, not real ones. Load your own archive to see your stats.</p>
    </div>
    <div id="actions" class="actions" hidden>
      <button id="sync" type="button" class="btn primary sync-btn">Sync games</button>
      <label class="btn">Load archive<input type="file" id="file-2" accept=".json,application/json" hidden></label>
    </div>
  </header>
  <p id="sync-status" class="sync-status" aria-live="polite" hidden></p>

  <section id="loader" class="empty">
    <div class="ico" aria-hidden="true">↻</div>
    <h3>No games yet</h3>
    <p class="sub">Sync your games, or drop a <code>mayhem-backup.json</code> file here. Your games stay in your browser.</p>
    <div class="row">
      <button type="button" class="btn primary sync-btn">Sync games</button>
      <label class="btn">Choose a file<input type="file" id="file" accept=".json,application/json" hidden></label>
    </div>
    <p id="load-error" class="error" hidden></p>
  </section>

  <main id="stats" hidden>
    <div class="toolbar">
      <label class="field"><span>Patch</span>
        <select id="f-patch"><option value="">All patches</option></select>
      </label>
      <label class="field"><span>Queue</span>
        <select id="f-queue"><option value="">All</option></select>
      </label>
      <label class="field"><span>From</span><input type="date" id="f-from"></label>
      <label class="field"><span>To</span><input type="date" id="f-to"></label>
      <label class="field grow"><span aria-hidden="true">⌕</span><input type="search" id="f-champ" placeholder="Champion" aria-label="Champion"></label>
      <button id="f-reset" type="button" class="btn">Reset</button>
    </div>

    <div class="stats-row" id="tiles"></div>

    <section class="card">
      <div class="card-h"><h3>Win rate by month</h3></div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="card-h"><h3>Kill map</h3>
        <div class="seg" role="group" aria-label="Show">
          <button type="button" data-km="kills" class="on">Kills</button>
          <button type="button" data-km="deaths">Deaths</button>
          <button type="button" data-km="both">Both</button>
        </div>
        <label class="foot">Map <select id="km-skin">
          <option value="2dlevelminimap">Howling Abyss</option>
          <option value="2dlevelminimap_bloom">Koeshin's Crossing</option>
          <option value="2dlevelminimap_bilgewater2">Butcher's Bridge</option>
          <option value="2dlevelminimap_crepe">Bridge of Progress</option>
        </select></label>
      </div>
      <div class="killmap">
        <div class="km-frame"><img id="km-img" alt=""><canvas id="km-canvas" width="512" height="512" role="img" aria-label="Where you got kills and died on the map"></canvas></div>
        <div class="km-side">
          <div id="km-legend" class="km-legend"></div>
          <p id="km-note" class="foot"></p>
        </div>
      </div>
    </section>

    <div class="two-col">
      <section class="card">
        <div class="card-h"><h3>Champions</h3></div>
        <div class="tbl-wrap"><table id="t-champs"></table></div>
      </section>
      <section class="card">
        <div class="card-h"><h3>Augments</h3>
          <span class="foot">At least <input type="number" id="f-minaug" value="3" min="1" class="tiny" aria-label="Minimum picks"> picks</span></div>
        <div class="tbl-wrap"><table id="t-augs"></table></div>
      </section>
    </div>

    <section class="card">
      <div class="card-h"><h3>Recent games</h3></div>
      <div class="tbl-wrap"><table id="t-games"></table></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
