name: Feature request
description: An idea for something DeepARAM could show or do.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: When would you use it? What does it save you?
  - type: dropdown
    id: area
    attributes:
      label: Part of the site
      options: [Tier List, Simulator, PBE, Champion pages, My Stats, The Lab, Info, Apps, Something new]
