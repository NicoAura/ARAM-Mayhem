name: China Mayhem stats

on:
  schedule:
    - cron: "0 6 * * *"   # 14:00 Beijing, after Tencent publishes the previous day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cn-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch current snapshot
        run: python3 data/cn/fetch_cn.py
      - name: Append new days and rebuild history
        run: python3 data/cn/history.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cn
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update China Mayhem stats ($(date -u +%Y-%m-%d))"
            git push
          fi
