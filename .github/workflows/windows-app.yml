name: Windows app

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - run: npm ci
      - name: Lint
        working-directory: apps/windows/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings
      - name: Build installers
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DeepARAM-Windows
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish the installer for download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="windows-v$version"
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "DeepARAM for Windows $version" --notes "Windows installer for DeepARAM $version." --prerelease
          fi
