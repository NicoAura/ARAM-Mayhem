name: iPad app

# Builds the iPad app whenever it or the shared Swift package changes.
on:
  pull_request:
    paths: ["apps/ipados/**", "apps/shared/**", ".github/workflows/ipad-app.yml"]
  push:
    branches: [main]
    paths: ["apps/ipados/**", "apps/shared/**", ".github/workflows/ipad-app.yml"]

concurrency:
  group: ipad-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Generate the Xcode project
        working-directory: apps/ipados
        run: brew install xcodegen && xcodegen
      - name: Build the app for the simulator
        working-directory: apps/ipados
        run: |
          xcodebuild build -project DeepARAMPad.xcodeproj -scheme DeepARAM \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 && status=0 || status=$?
          grep -E "error:" -A4 build.log | head -150 || true
          tail -15 build.log
          exit $status
