<meta charset="utf-8">
<title>The Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the DeepARAM app shell (sticky bar with pill tabs) around The Lab tab; each tool runs in its own frame below a pill switcher. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --raised: #eef1f5; --fg: #0c1017; --muted: #5b6472; --line: #e1e5eb;
  --accent: #0b7fc0; --accent-ink: #ffffff; --accent-soft: #e3f1fa;
  --display: "Bricolage Grotesque", "Geist", system-ui, sans-serif;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090b0f; --surface: #11151c; --raised: #181d26; --fg: #e8ecf2; --muted: #8b94a3; --line: #222936;
  --accent: #5cc0ff; --accent-ink: #04121c; --accent-soft: #0f2533; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #090b0f; --surface: #11151c; --raised: #181d26; --fg: #e8ecf2; --muted: #8b94a3; --line: #222936;
  --accent: #5cc0ff; --accent-ink: #04121c; --accent-soft: #0f2533; color-scheme: dark }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { font: 700 19px/1 var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; flex: none; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(from 200deg, var(--accent), #8a7dff, #ff7ac6, #ffc35a, var(--accent)); display: block; }
.brand b { color: var(--accent); }
.site-nav { display: flex; gap: 2px; padding: 3px; background: var(--raised); border-radius: 999px; overflow-x: auto; scrollbar-width: none; min-width: 0; margin-inline: auto; }
.site-nav::-webkit-scrollbar { display: none; }
.site-nav span { flex: none; padding: 6px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.site-nav span[aria-current] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); }
.bar-spacer { width: 100px; flex: none; }

main { padding-block: 28px 64px; }
.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.intro > div { display: grid; gap: 6px; }
.label { font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font: 700 clamp(30px, 4.6vw, 44px)/1.04 var(--display); letter-spacing: -.035em; text-wrap: balance; margin: 0; }
.intro p.sub { color: var(--muted); max-width: 52ch; font-size: 14px; margin: 0; }

.tabs { display: flex; gap: 2px; padding: 3px; background: var(--raised); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; font: 500 13.5px var(--sans); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px 12px; border-radius: 9px; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }

.panels { padding-top: 8px; }
.panel iframe { display: block; width: 100%; border: 0; min-height: 600px; background: var(--bg); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; padding-top: 20px; }
.tool-card { display: grid; gap: 4px; text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.tool-card:hover { border-color: var(--muted); }
.tool-name { font-weight: 600; }
.tool-desc { color: var(--muted); font-size: 13.5px; }
.note { color: var(--muted); font-size: 12.5px; padding-top: 20px; max-width: 62ch; }
.note code { font-family: var(--mono); font-size: 12px; }

@media (max-width: 860px) { .bar-spacer { display: none; } }
@media (max-width: 640px) {
  .bar .wrap { flex-wrap: wrap; height: auto; padding-block: 10px; gap: 10px; }
  .site-nav { order: 3; width: 100%; margin: 0; }
}
</style>

<header class="bar">
  <div class="wrap">
    <span class="brand"><i></i><span>Deep<b>ARAM</b></span></span>
    <nav class="site-nav" aria-label="Site sections">
      <span>Home</span><span>Stats</span><span>Tier List</span><span>Simulator</span><span>PBE</span><span aria-current="page">The Lab</span>
    </nav>
    <span class="bar-spacer"></span>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <div><p class="label">Calculators and cook builds</p><h1>The Lab</h1></div>
    <p class="sub">Pick a champion, items and augments and see how far the numbers go. Each tool loads the best build found so far; change anything to try your own.</p>
  </section>

  <nav class="tabs" role="tablist" aria-label="The Lab">
    <button class="tab" type="button" role="tab" id="tab-home" data-go="home">Overview</button>
    <!--TABS-->
  </nav>

  <div class="panels">
    <section class="panel" id="panel-home" role="tabpanel" hidden>
      <div class="cards">
        <!--CARDS-->
      </div>
      <p class="note">This preview bundles the tab exactly as the website serves it.</p>
    </section>
    <!--FRAMES-->
  </div>
</main>

<script>
(function () {
  "use strict";
  const PAGES = /*PAGES*/null;
  const frames = {};

  function syncTheme(doc) {
    const t = document.documentElement.getAttribute("data-theme");
    if (t) doc.documentElement.setAttribute("data-theme", t);
    else doc.documentElement.removeAttribute("data-theme");
  }

  function fit(frame) {
    const doc = frame.contentDocument;
    if (doc && doc.body) frame.style.height = doc.documentElement.scrollHeight + "px";
  }

  function load(id) {
    const panel = document.getElementById("panel-" + id);
    const frame = panel && panel.querySelector("iframe");
    if (!frame || frames[id]) return;
    frames[id] = frame;
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      syncTheme(doc);
      const preset = doc.getElementById("preset");
      if (preset) preset.click();
      fit(frame);
      new ResizeObserver(() => fit(frame)).observe(doc.body);
    });
    frame.srcdoc = PAGES[id];
  }

  function show(id) {
    if (id !== "home" && !PAGES[id]) id = "home";
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.go === id)));
    document.querySelectorAll(".panel").forEach((p) => { p.hidden = p.id !== "panel-" + id; });
    load(id);
    if (frames[id]) fit(frames[id]);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-go]");
    if (b) show(b.dataset.go);
  });
  window.addEventListener("message", (e) => { if (e.data === "fun-home") show("home"); });
  new MutationObserver(() => Object.values(frames).forEach((f) => f.contentDocument && syncTheme(f.contentDocument)))
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  const start = location.hash.slice(1);
  show(PAGES && PAGES[start] ? start : "ryze-calculator");
})();
</script>
