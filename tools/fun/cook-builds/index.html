<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cook Builds · The Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow"><a href="../index.html">The Lab</a> · ARAM Mayhem</p>
      <h1>Cook Builds</h1>
      <p class="muted">Troll builds built on strange augment interactions: a hook that lands like a fully built auto-attack, an artillery mage gone melee, and champions who swap their range. Each is checked against Mayhem win rates and the damage simulator.</p>
    </header>

    <section id="chefs-special" class="chef" aria-labelledby="chef-label" hidden></section>

    <div class="controls">
      <div class="filters" role="group" aria-label="Filter by tier" id="filters"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="tier">Tier</option>
          <option value="core">Augment win rate</option>
          <option value="champ">Champion win rate</option>
          <option value="name">Champion name</option>
        </select>
      </label>
    </div>

    <section id="builds" aria-live="polite"></section>

    <footer class="muted small" id="footer"></footer>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
