<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cook Builds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Cook builds · ARAM Mayhem</p>
      <h1>Cook Builds</h1>
      <p class="muted">Off-meta and troll champion, item and augment combos, each checked against China-server Mayhem win rates and the damage simulator.</p>
    </header>

    <div class="controls">
      <div class="filters" role="group" aria-label="Filter by tier" id="filters"></div>
      <label class="sort">Sort
        <select id="sort">
          <option value="tier">Tier</option>
          <option value="core">Augment win rate</option>
          <option value="champ">Champion win rate</option>
          <option value="name">Champion name</option>
        </select>
      </label>
    </div>

    <section id="builds" aria-live="polite"></section>

    <footer class="muted small" id="footer"></footer>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
